<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Libro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<header>
    <h1>Agregar Libro</h1>
</header>

<div class="container">

    <div class="form-card">

        <form method="POST">

            <div class="form-group">

                <label>Título del Libro</label>

                <input
                    type="text"
                    name="titulo"
                    required>

            </div>

            <div class="form-group">

                <label>ISBN</label>

                <input
                    type="text"
                    name="isbn"
                    required>

            </div>

            <div class="form-group">

                <label>Año de Publicación</label>

                <input
                    type="number"
                    name="anio_publicacion"
                    min="1900"
                    max="2100"
                    required>

            </div>

            <div class="form-group">

                <label>Autor</label>

                <select
                    name="id_autor"
                    required>

                    <option value="">
                        Seleccione un autor
                    </option>

                    {% for autor in autores %}

                    <option value="{{ autor.id }}">
                        {{ autor.nombre }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>Categoría</label>

                <select
                    name="id_categoria"
                    required>

                    <option value="">
                        Seleccione una categoría
                    </option>

                    {% for categoria in categorias %}

                    <option value="{{ categoria.id }}">
                        {{ categoria.nombre }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>Cantidad Total</label>

                <input
                    type="number"
                    name="cantidad_total"
                    min="1"
                    required>

            </div>

            <div class="form-group">

                <label>Cantidad Disponible</label>

                <input
                    type="number"
                    name="cantidad_disponible"
                    min="0"
                    required>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Guardar

                </button>

                <a href="{{ url_for('libros.listar_libros') }}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
