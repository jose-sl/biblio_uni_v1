<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Libro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<header>

    <div class="header-content">

        <h1>
            Agregar Libro
        </h1>

    </div>

</header>

<div class="container">

    <div class="form-card">

        <form method="POST">

            <div class="form-group">

                <label>
                    ISBN
                </label>

                <input
                    type="text"
                    name="isbn"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Título
                </label>

                <input
                    type="text"
                    name="titulo"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Editorial
                </label>

                <input
                    type="text"
                    name="editorial">

            </div>

            <div class="form-group">

                <label>
                    Año de Publicación
                </label>

                <input
                    type="number"
                    name="anio_publicacion"
                    min="1900"
                    max="2100">

            </div>

            <div class="form-group">

                <label>
                    Autor
                </label>

                <select
                    name="id_autor"
                    required>

                    <option value="">
                        Seleccione un autor
                    </option>

                    {% for autor in autores %}

                    <option value="{{ autor.id }}">
                        {{ autor.nombre }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>
                    Categoría
                </label>

                <select
                    name="id_categoria"
                    required>

                    <option value="">
                        Seleccione una categoría
                    </option>

                    {% for categoria in categorias %}

                    <option value="{{ categoria.id }}">
                        {{ categoria.nombre }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>
                    Ejemplares Totales
                </label>

                <input
                    type="number"
                    name="ejemplares_totales"
                    min="1"
                    value="1"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Ejemplares Disponibles
                </label>

                <input
                    type="number"
                    name="ejemplares_disponibles"
                    min="0"
                    value="1"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Ubicación
                </label>

                <input
                    type="text"
                    name="ubicacion"
                    placeholder="Ej. Estante A-01">

            </div>

            <div class="form-group">

                <label>
                    Estado
                </label>

                <select name="estado">

                    <option value="Disponible" selected>
                        Disponible
                    </option>

                    <option value="No Disponible">
                        No Disponible
                    </option>

                </select>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Guardar

                </button>

                <a href="{{ url_for('libros.listar_libros') }}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
