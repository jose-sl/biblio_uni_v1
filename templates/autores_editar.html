<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Autor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<header>
    <h1>Agregar Autor</h1>
</header>

<div class="container">

    <div class="form-card">

        <form method="POST">

            <div class="form-group">
                <label>Nombres</label>
                <input type="text"
                       name="nombres"
                       value="{{ autor.nombres }}"
                       required>
            </div>

            <div class="form-group">
                <label>Apellidos</label>
                <input type="text"
                       name="apellidos"
                       value="{{ autor.apellidos }}"
                       required>
            </div>

            <div class="form-group">
                <label>Nacionalidad</label>
                <input type="text"
                       name="nacionalidad"
                       value="{{ autor.nacionalidad }}">
            </div>

            <div class="form-group">
                <label>Fecha de Nacimiento</label>
                <input type="date"
                       name="fecha_nacimiento"
                       value="{{ autor.fecha_nacimiento }}">
            </div>

            <div class="form-actions">

                <button type="submit"
                        class="btn btn-primary">
                    Guardar
                </button>

                <a href="{{ url_for('autores.listar_autores') }}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
