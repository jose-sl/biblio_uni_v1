<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Categoría</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<header>
    <h1>Agregar Categoría</h1>
</header>

<div class="container">

    <div class="form-card">

        <form method="POST">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text"
                       name="nombre"
                       value="{{ categoria.nombre }}"
                       required>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion"
                          rows="4">{{ categoria.descripcion }}</textarea>
            </div>

            <div class="form-actions">

                <button type="submit"
                        class="btn btn-primary">
                    Guardar
                </button>

                <a href="{{ url_for('categorias.listar_categorias') }}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
