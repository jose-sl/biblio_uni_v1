<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Libro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<header>

    <div class="header-content">

        <h1>
            Editar Libro
        </h1>

    </div>

</header>

<div class="container">

    <div class="form-card">

        <form method="POST">

            <div class="form-group">

                <label>
                    ISBN
                </label>

                <input
                    type="text"
                    name="isbn"
                    value="{{ libro.isbn }}"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Título
                </label>

                <input
                    type="text"
                    name="titulo"
                    value="{{ libro.titulo }}"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Editorial
                </label>

                <input
                    type="text"
                    name="editorial"
                    value="{{ libro.editorial }}">

            </div>

            <div class="form-group">

                <label>
                    Año de Publicación
                </label>

                <input
                    type="number"
                    name="anio_publicacion"
                    value="{{ libro.anio_publicacion }}"
                    min="1900"
                    max="2100">

            </div>

            <div class="form-group">

                <label>
                    Autor
                </label>

                <select
                    name="id_autor"
                    required>

                    {% for autor in autores %}

                    <option
                        value="{{ autor.id }}"
                        {% if autor.id == libro.id_autor %}
                        selected
                        {% endif %}>

                        {{ autor.nombre }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>
                    Categoría
                </label>

                <select
                    name="id_categoria"
                    required>

                    {% for categoria in categorias %}

                    <option
                        value="{{ categoria.id }}"
                        {% if categoria.id == libro.id_categoria %}
                        selected
                        {% endif %}>

                        {{ categoria.nombre }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>
                    Ejemplares Totales
                </label>

                <input
                    type="number"
                    name="ejemplares_totales"
                    value="{{ libro.ejemplares_totales }}"
                    min="1"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Ejemplares Disponibles
                </label>

                <input
                    type="number"
                    name="ejemplares_disponibles"
                    value="{{ libro.ejemplares_disponibles }}"
                    min="0"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Ubicación
                </label>

                <input
                    type="text"
                    name="ubicacion"
                    value="{{ libro.ubicacion }}">

            </div>

            <div class="form-group">

                <label>
                    Estado
                </label>

                <select name="estado">

                    <option
                        value="Disponible"
                        {% if libro.estado == 'Disponible' %}
                        selected
                        {% endif %}>
                        Disponible
                    </option>

                    <option
                        value="No Disponible"
                        {% if libro.estado == 'No Disponible' %}
                        selected
                        {% endif %}>
                        No Disponible
                    </option>

                </select>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Actualizar

                </button>

                <a href="{{ url_for('libros.listar_libros') }}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
