<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<header>
    <h1>Gestión de Categorías</h1>
</header>

<div class="container">

    <a href="{{ url_for('categorias.agregar_categoria') }}"
       class="btn btn-primary">
        Agregar Categoría
    </a>

    <br><br>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                {% for categoria in categorias %}
                <tr>

                    <td>{{ categoria.id }}</td>
                    <td>{{ categoria.nombre }}</td>
                    <td>{{ categoria.descripcion }}</td>

                    <td>

                        <a href="{{ url_for('categorias.editar_categoria', id=categoria.id) }}"
                           class="btn btn-primary">
                            Editar
                        </a>

                        <a href="{{ url_for('categorias.eliminar_categoria', id=categoria.id) }}"
                           class="btn btn-danger"
                           onclick="return confirm('¿Eliminar categoría?')">
                            Eliminar
                        </a>

                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

    <br>

    <a href="{{ url_for('dashboard.inicio') }}"
       class="btn btn-secondary">
        Volver al Dashboard
    </a>

</div>

</body>
</html>
