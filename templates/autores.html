<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Autores</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<header>
    <h1>Gestión de Autores</h1>
</header>

<div class="container">

    <a href="{{ url_for('autores.agregar_autor') }}"
       class="btn btn-primary">
        Agregar Autor
    </a>

    <br><br>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Nacionalidad</th>
                    <th>Fecha Nacimiento</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                {% for autor in autores %}
                <tr>

                    <td>{{ autor.id }}</td>
                    <td>{{ autor.nombres }}</td>
                    <td>{{ autor.apellidos }}</td>
                    <td>{{ autor.nacionalidad }}</td>
                    <td>{{ autor.fecha_nacimiento }}</td>

                    <td>

                        <a href="{{ url_for('autores.editar_autor', id=autor.id) }}"
                           class="btn btn-primary">
                            Editar
                        </a>

                        <a href="{{ url_for('autores.eliminar_autor', id=autor.id) }}"
                           class="btn btn-danger"
                           onclick="return confirm('¿Eliminar autor?')">
                            Eliminar
                        </a>

                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

    <br>

    <a href="{{ url_for('dashboard.inicio') }}"
       class="btn btn-secondary">
        Volver al Dashboard
    </a>

</div>

</body>
</html>
